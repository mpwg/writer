[package]
name = "writer"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2.2"
serde_json = "1.0"
tempfile = "3.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["serde", "v4", "v5"] }
unicode-segmentation = "1.13"
pulldown-cmark = { version = "0.13", default-features = false }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-as-lib = "0.18"

[dev-dependencies]
gpui-kit = { version = "0.11", features = ["test-support"] }
pdf-extract = "0.12"
